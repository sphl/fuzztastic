[project]
name = "fuzztastic"
version = "1.2.0"
description = "A fuzzer-agnostic real-time coverage analyzer."
authors = [
    {name = "Stephan Lipp",email = "sphlpp91@gmail.com"}
]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer (>=0.16.0,<0.17.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "types-pyyaml (>=6.0.12.20250516,<7.0.0.0)",
    "posix-ipc (>=1.2.0,<2.0.0)",
    "numpy (>=2.3.1,<3.0.0)",
    "pandas (>=2.3.1,<3.0.0)",
    "dash (>=3.1.1,<4.0.0)",
    "plotly (>=6.2.0,<7.0.0)"
]

[tool.poetry.scripts]
fuzztastic = "fuzztastic.main:app"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.2.0"
ruff = "^0.12.5"
mypy = "^1.16.1"
pytest = "^8.4.1"
pytest-cov = "^6.2.1"
coverage = "^7.9.1"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
  # pyflakes
  "F",
  # pycodestyle
  "E",
  "W",
  # isort
  "I",
  # pep8-naming
  "N",
  # pyupgrade
  "UP",
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
check_untyped_defs = true
disallow_untyped_defs = true
explicit_package_bases = true
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_ignores = true

[tool.pytest.ini_options]
# addopts = "-ra --cov fuzztastic"
addopts = "-ra -q"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
