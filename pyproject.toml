[project]
name = "fuzztastic"
version = "1.2.0"
description = "A fuzzer-agnostic real-time coverage analyzer."
authors = [
    {name = "Stephan Lipp",email = "sphlpp91@gmail.com"}
]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer (>=0.16.0,<0.17.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "types-pyyaml (>=6.0.12.20250516,<7.0.0.0)",
    "posix-ipc (>=1.2.0,<2.0.0)",
    "numpy (>=2.3.1,<3.0.0)"
]
packages = [{from = "src", include = "fuzztastic"}]

[tool.poetry.scripts]
fuzztastic = "fuzztastic.main:app"

[tool.poetry.group.dev.dependencies]
isort = "^6.0.1"
black = "^25.1.0"
pytest = "^8.4.1"
pytest-cov = "^6.2.1"
coverage = "^7.9.1"
mypy = "^1.16.1"

[tool.pytest.ini_options]
# addopts = "-ra --cov fuzztastic"
addopts = "-ra -q"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
